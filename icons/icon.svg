<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12131C"/>
      <stop offset="100%" stop-color="#08090D"/>
    </linearGradient>

    <!-- Side Panel Pill Gradient (Vivaldi Coral) -->
    <linearGradient id="sidebarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5252"/>
      <stop offset="100%" stop-color="#FF1744"/>
    </linearGradient>

    <!-- Left Crystal Facet (Electric Cyan) -->
    <linearGradient id="facetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <!-- Right Crystal Facet (Neon Emerald / Mint) -->
    <linearGradient id="facetRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#60EFFF"/>
    </linearGradient>

    <!-- Core Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F2FE" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows for Depth -->
    <filter id="glowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#00F2FE" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base (Squircle) -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="#232635" stroke-width="4"/>
  
  <!-- Subtle Backlight -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)"/>

  <!-- Main Graphic Group -->
  <g filter="url(#glowShadow)">
    <!-- Vivaldi Side Panel Pillar -->
    <rect x="96" y="128" width="32" height="256" rx="16" fill="url(#sidebarGrad)"/>

    <!-- Knowledge-Shard Lightning Emblem -->
    <!-- Left Facet (Light/Cyan) -->
    <path d="M 296 96 
             L 264 240 
             L 176 268 
             L 240 268 
             L 192 416 
             Z" 
          fill="url(#facetLeft)"/>

    <!-- Right Facet (Accent/Emerald Shard) -->
    <path d="M 296 96 
             L 384 96 
             L 280 240 
             L 352 240 
             L 192 416 
             L 264 240 
             Z" 
          fill="url(#facetRight)"/>
  </g>
</svg>
